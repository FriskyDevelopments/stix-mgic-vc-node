services:
  - type: web
    name: stix-mgic-vc-node
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: VITE_DEMO_MODE
        value: "false"
      - key: AUTH_REQUIRED
        value: "false"
      - key: MEDIA_PLANE_ENABLED
        value: "true"
      - key: OPERATOR_TOKEN_SECRET
        generateValue: true
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: VITE_DISCORD_CLIENT_ID
        sync: false
      - key: VITE_SPOTIFY_CLIENT_ID
        value: "cad4d11caecc4418babaf3c39ab9cb7c"
      - key: TELEGRAM_VC_API_ID
        sync: false
      - key: TELEGRAM_VC_API_HASH
        sync: false
      - key: TELEGRAM_VC_SESSION_STRING
        sync: false
